<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAD60"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF8C42" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect x="10" y="10" width="180" height="180" rx="45" fill="url(#logoGrad)" filter="url(#logoShadow)"/>
  
  <!-- Cup Shape -->
  <path d="M 60 70 L 140 70 L 130 145 C 129 152 122 158 114 158 L 86 158 C 78 158 71 152 70 145 Z" fill="#FFFFFF"/>
  
  <!-- Tea Liquid Line -->
  <path d="M 68 95 Q 100 105 132 95 L 127 142 C 126 147 121 151 115 151 L 85 151 C 79 151 74 147 73 142 Z" fill="#FF8C42" opacity="0.85"/>
  
  <!-- Leaf Icon at Top -->
  <g transform="translate(100, 48) rotate(-15)">
    <path d="M 0 0 C 18 -18 36 0 24 22 C 8 22 -6 8 0 0 Z" fill="#22C55E"/>
    <path d="M 0 0 C 10 0 18 10 24 22" stroke="#15803D" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Steam / Aroma swirls -->
  <path d="M 80 55 Q 85 45 80 35" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 120 58 Q 125 48 120 38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  
  <!-- Straw -->
  <line x1="125" y1="35" x2="105" y2="85" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
</svg>
